<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonhagro - Catálogo de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="ambient-bg">
    <header class="header-custom">
        <div class="container">
            <div class="row align-items-center py-4">
                <div class="col-md-3">
                    <img src="/assets/a2.png" alt="Sonhagro Logo" class="logo-img">
                </div>
                <div class="col-md-9">
                    <nav class="text-end">
                        <a href="#catalogo" class="nav-link-custom">Catálogo</a>
                        <button id="openCartBtn" class="cart-button"><i class="fas fa-shopping-cart"></i><span id="cartCount" class="cart-count">0</span></button>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <section class="hero-banner">
        <div class="banner-carousel">
            <div class="banner-slide active">
                <picture>
                    <source media="(max-width: 768px)" srcset="/assets/desktop1.png">
                    <img src="/assets/desktop1.png" alt="Banner 1" class="banner-image">
                </picture>
            </div>
           
            <!-- Adicione mais slides aqui conforme necessário -->
        </div>
        
        <!-- Indicadores -->
        <div class="banner-indicators">
            <span class="indicator active" data-slide="0"></span>
            <span class="indicator" data-slide="1"></span>
            <!-- Adicione mais indicadores conforme o número de slides -->
        </div>
        
        <!-- Setas de navegação -->
        <button class="banner-nav prev" aria-label="Anterior">
            <i class="fas fa-chevron-left"></i>
        </button>
        <button class="banner-nav next" aria-label="Próximo">
            <i class="fas fa-chevron-right"></i>
        </button>
    </section>
    <div id="cartPanel" class="cart-panel">
        <div class="cart-header">
            <div>Carrinho</div>
            <button id="closeCartBtn" class="cart-close"><i class="fas fa-times"></i></button>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-actions">
            <button id="checkoutBtn" class="btn-custom cart-btn">Realizar pedido</button>
            <button id="continueBtn" class="btn-outline cart-btn">Continuar comprando</button>
            <button id="clearCartBtn" class="btn-danger cart-btn">Limpar carrinho</button>
        </div>
    </div>
    <div id="cartOverlay" class="cart-overlay"></div>

    <section id="catalogo" class="products-section">
        <div class="container">
            <div class="text-center mb-5">
                <h2 class="section-title">Nossos Produtos</h2>
                <p class="section-subtitle">Produtos exclusivos para franqueados Sonhagro</p>
            </div>

            <div class="row align-items-center mb-4">
                <div class="col-md-6 mb-3 mb-md-0">
                    <input id="searchInput" type="text" class="form-control search-input" placeholder="Buscar produtos...">
                </div>
                <div class="col-md-3 mb-3 mb-md-0">
                    <select id="sortSelect" class="form-select sort-select">
                        <option value="name-asc">Ordenar: A–Z</option>
                        <option value="name-desc">Ordenar: Z–A</option>
                    </select>
                </div>
                <div class="col-md-3 text-md-end">
                    <div id="resultsInfo" class="results-info"></div>
                </div>
            </div>

            <div class="row g-4" id="productsGrid">
            </div>
        </div>
    </section>

    <div id="imageModal" class="modal-custom">
        <button class="modal-close" onclick="closeModal()">
            <i class="fas fa-times"></i>
        </button>
        <div class="modal-content-custom">
            <img id="modalImage" src="" alt="Produto">
            <div class="modal-info">
                <h3 id="modalTitle"></h3>
                <p id="modalDescription"></p>
            </div>
        </div>
    </div>

    <footer class="footer-custom">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <div class="footer-brand">
                        <img src="/assets/a2.png" alt="Sonhagro" class="footer-logo">
                        <div class="footer-tagline">Produtos de qualidade para nossos franqueados</div>
                    </div>
                </div>
                <div class="col-md-6 text-end">
                    <div class="social-icons">
                        <a href="#"><i class="fab fa-facebook"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-linkedin"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <button id="backToTop" class="back-to-top">▲</button>
    <div id="sweepOverlay" class="sweep-overlay"></div>
</body>
</html>
